services:
  - type: web
    name: biryani-on-wheels-test
    runtime: python
    plan: free
    rootDir: artifacts/biryani-on-wheels
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
